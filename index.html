<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a2540">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title></title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=5">
</head>
<body>
  <div class="sim-ribbon" id="simRibbon"></div>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <img src="./icon-192.png" alt="">
        <div style="min-width:0"><h1 id="htitle"></h1><small id="hstatus"></small></div>
      </div>
      <button type="button" class="btn-install" id="install"></button>
      <div class="clock"><span id="clock">--:--</span><small id="clockday"></small></div>
    </div>
  </header>

  <main class="wrap" id="main">
    <section class="hero" id="hero" aria-live="polite"></section>
  </main>

  <button class="fab" id="fab" type="button"></button>
  <div class="toast" id="toast" role="status"></div>

  <nav class="bnav" id="bnav">
    <div class="wrap" id="bnavDays"></div>
  </nav>

  <script src="./app.js?v=5"></script>
</body>
</html>
